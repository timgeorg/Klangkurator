<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111112" />
    <link rel="icon" type="image/svg+xml" href="/design-system/assets/favicon.svg" />
    <script>
      // Paint the saved theme before first paint. `settings.json` is the only
      // store, so it is read over the API; the synchronous XHR in the head
      // finishes long before the first frame, and the default covers a miss.
      (function () {
        var root = document.documentElement;
        var apply = function (dark) {
          root.classList.add(dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
        };
        var prefersDark = function () {
          return matchMedia("(prefers-color-scheme: dark)").matches;
        };
        apply(true);
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "/api/settings", false);
          xhr.send();
          if (xhr.status === 200) {
            var theme = JSON.parse(xhr.responseText).theme;
            if (theme === "light") { root.classList.remove("dark"); apply(false); }
            else if (theme === "system") { root.classList.remove("light", "dark"); apply(prefersDark()); }
          }
        } catch (e) {
          /* the default theme is already applied */
        }
      })();
    </script>
    <title>Klangkurator — DJ Music Library Organizer</title>
    <meta name="description" content="Local-first DJ music library: crates, tagged tracks, real waveforms, relationships between tracks, and phase-based set planning." />
    <meta name="author" content="Tim Georg" />
    <meta property="og:title" content="Klangkurator — DJ Music Library Organizer" />
    <meta property="og:description" content="Local-first DJ music library: crates, tagged tracks, real waveforms, relationships between tracks, and phase-based set planning." />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
