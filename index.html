<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111112" />
    <link rel="icon" type="image/svg+xml" href="/design-system/assets/favicon.svg" />
    <script>
      // Apply the saved theme before first paint (next-themes takes over after mount).
      (function () {
        try {
          var t = localStorage.getItem("klangkurator.theme.v1");
          var dark = t ? t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) : true;
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Klangkurator — DJ Music Library Organizer</title>
    <meta name="description" content="Local-first DJ music library: crates, tagged tracks, real waveforms, relationships between tracks, and phase-based set planning." />
    <meta name="author" content="Tim Georg" />
    <meta property="og:title" content="Klangkurator — DJ Music Library Organizer" />
    <meta property="og:description" content="Local-first DJ music library: crates, tagged tracks, real waveforms, relationships between tracks, and phase-based set planning." />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
