name: CI

on:
  pull_request:
  push:
    branches: [main, int]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  backend:
    name: Backend — tests, code standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The standards gate diffs the PR against its base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt pytest
      - run: python -m pytest backend/tests

      - name: Code standards on the changed Python files
        if: github.event_name == 'pull_request'
        run: python scripts/check_code_standards.py --range "origin/${{ github.base_ref }}...HEAD" --exclude "scripts/check_*.py"
